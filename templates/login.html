<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0">
<title>{{ dashboard_title }} — Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #0a0c0f;
    --bg2:    #111318;
    --bg3:    #181c22;
    --border: #1e2530;
    --text:   #c8d0dc;
    --muted:  #4a5568;
    --accent: #f0a500;
    --loss:   #ef4444;
    --mono:   'IBM Plex Mono', monospace;
    --sans:   'Inter', sans-serif;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 48px;
    width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .logo {
    font-size: 48px;
    line-height: 1;
  }

  .title {
    text-align: center;
  }

  .title h1 {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }

  .title p {
    font-size: 12px;
    color: var(--muted);
  }

  .form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  input {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text);
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--accent); }

  .error {
    background: rgba(239,68,68,0.1);
    border: 1px solid var(--loss);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--loss);
    text-align: center;
    width: 100%;
  }

  .submit-btn {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 12px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    color: #000;
    width: 100%;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 4px;
  }

  .submit-btn:hover { opacity: 0.9; }

  .footer-text {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">🏠</div>

  <div class="title">
    <h1>{{ dashboard_title }}</h1>
    <p>Sign in to continue</p>
  </div>

  <form class="form" method="POST" action="/login">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
    </div>

    <button type="submit" class="submit-btn">Sign In</button>
  </form>

  <div class="footer-text">Local network access only</div>
</div>

</body>
</html>
